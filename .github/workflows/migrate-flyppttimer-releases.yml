name: Migrate FlyPPTTimer releases (one time)
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/migrate-flyppttimer-releases.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  releases:
    if: github.repository == 'Hona-Cao/ppttimer'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add final version tag without copying restricted workflow history
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --tags origin 'refs/tags/v1.18.0' | grep -q v1.18.0; then
            git tag v1.18.0 HEAD
            git push origin refs/tags/v1.18.0
          fi
      - name: Recreate every published release and copy exact downloadable assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          src='Hona-Cao/FlyPPTTimer'
          dst='Hona-Cao/ppttimer'
          def run(*args):
              subprocess.run(['gh',*map(str,args)],check=True)
          def js(*args):
              return json.loads(subprocess.check_output(['gh',*map(str,args)],text=True))
          rs=js('api',f'repos/{src}/releases?per_page=100')
          if len(rs)>=100: raise SystemExit('Source has >=100 releases; pagination required')
          rs.sort(key=lambda r:r.get('published_at') or '')
          for r in rs:
              tag=r['tag_name']
              print('Importing',tag,flush=True)
              with tempfile.TemporaryDirectory() as td:
                  d=Path(td)
                  notes=d/'release-notes.md'
                  notes.write_text((r.get('body') or '').replace(
                      'https://github.com/'+src,'https://github.com/'+dst),encoding='utf-8')
                  existing=subprocess.run(['gh','release','view',tag,'--repo',dst],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode == 0
                  if existing:
                      run('release','edit',tag,'--repo',dst,'--title',r.get('name') or tag,
                          '--notes-file',notes)
                  else:
                      opts=['--draft'] if r.get('draft') else []
                      if r.get('prerelease'):opts.append('--prerelease')
                      run('release','create',tag,'--verify-tag','--repo',dst,
                          '--title',r.get('name') or tag,'--notes-file',notes,*opts)
                  assets=r.get('assets') or []
                  if assets:
                      dd=d/'assets'
                      dd.mkdir()
                      run('release','download',tag,'--repo',src,'--dir',dd)
                      files=sorted(p for p in dd.iterdir() if p.is_file())
                      expected=sorted(a['name'] for a in assets)
                      if sorted(p.name for p in files)!=expected:
                          raise SystemExit('Asset list mismatch: '+tag)
                      run('release','upload',tag,*files,'--repo',dst,'--clobber')
                  print('Imported',tag,'assets',len(assets),flush=True)
          out=js('api',f'repos/{dst}/releases?per_page=100')
          a={r['tag_name']:sorted(x['name'] for x in r.get('assets',[])) for r in rs}
          b={r['tag_name']:sorted(x['name'] for x in r.get('assets',[])) for r in out}
          if a!=b:raise SystemExit('Release/asset verification failed')
          print('Verified',len(a),'releases and',sum(len(v) for v in a.values()),'assets')
          PY
