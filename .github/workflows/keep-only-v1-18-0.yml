name: Keep only FlyPPTTimer v1.18.0
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/keep-only-v1-18-0.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'Hona-Cao/ppttimer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove all migrated releases and tags other than v1.18.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          source='Hona-Cao/FlyPPTTimer'
          repo='Hona-Cao/ppttimer'
          keep='v1.18.0'
          def api(route):
              return json.loads(subprocess.check_output(['gh','api',route],text=True))
          def delete(route):
              subprocess.run(['gh','api','-X','DELETE',route],check=True)
          source_releases=api(f'repos/{source}/releases?per_page=100')
          reference=next(r for r in source_releases if r['tag_name']==keep)
          expected={a['name']:a['size'] for a in reference.get('assets',[])}
          if len(expected)!=2:raise SystemExit('Unexpected source v1.18.0 assets')
          releases=api(f'repos/{repo}/releases?per_page=100')
          for r in releases:
              if r['tag_name'] == keep: continue
              print('Removing old release:',r['tag_name'],flush=True)
              delete(f"repos/{repo}/releases/{r['id']}")
          tags=api(f'repos/{repo}/git/refs/tags')
          for t in tags:
              tag=t['ref'].removeprefix('refs/tags/')
              if tag==keep: continue
              print('Removing old tag:',tag,flush=True)
              delete(f'repos/{repo}/git/refs/tags/{tag}')
          out=api(f'repos/{repo}/releases?per_page=100')
          remaining_tags=api(f'repos/{repo}/git/refs/tags')
          if [r['tag_name'] for r in out]!=[keep]:
              raise SystemExit('Expected exactly one v1.18.0 release')
          if [t['ref'] for t in remaining_tags]!=['refs/tags/'+keep]:
              raise SystemExit('Expected exactly one v1.18.0 tag')
          actual={a['name']:a['size'] for a in out[0].get('assets',[])}
          if actual!=expected:
              raise SystemExit(f'Assets differ from source: {actual} != {expected}')
          print('Verified only v1.18.0, with original 2 packages and matching sizes.')
          PY
